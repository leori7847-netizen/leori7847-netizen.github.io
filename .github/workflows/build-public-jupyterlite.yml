name: Build public JupyterLite

on:
  push:
    branches: [main]
    paths:
      - "ai-exam-simulator/lite-src/**"
      - "ai-exam-simulator/scripts/build_public_lite_content.py"
      - "ai-exam-simulator/requirements-public-lite.txt"
      - ".github/workflows/build-public-jupyterlite.yml"

permissions:
  contents: write

concurrency:
  group: public-jupyterlite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-exam-simulator/requirements-public-lite.txt
      - name: Install JupyterLite builder
        run: python -m pip install -r ai-exam-simulator/requirements-public-lite.txt
      - name: Generate sanitized exercise content
        run: python ai-exam-simulator/scripts/build_public_lite_content.py
      - name: Build browser Jupyter
        working-directory: ai-exam-simulator
        run: jupyter lite build --lite-dir lite-src --output-dir lite --apps lab --no-sourcemaps --no-unused-shared-packages
      - name: Commit generated static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-exam-simulator/lite
          if git diff --cached --quiet; then
            echo "JupyterLite output is unchanged."
          else
            git commit -m "Build public JupyterLite [skip ci]"
            git push
          fi
